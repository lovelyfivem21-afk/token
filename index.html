<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Token Checker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #0d0e1a 0%, #1a1b2e 50%, #0a0b12 100%);
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(91, 110, 224, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(139, 156, 247, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(139, 156, 247, 0.3);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        .container {
            max-width: 950px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(28, 29, 45, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 2rem;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.05),
                0 0 40px rgba(91, 110, 224, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.6s ease-out;
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: 
                0 25px 70px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 60px rgba(91, 110, 224, 0.08);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 1.8rem;
            animation: slideInLeft 0.5s ease-out 0.2s both;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .card-header i {
            font-size: 2.2rem;
            color: #8b9cf7;
            background: rgba(59, 61, 90, 0.6);
            padding: 12px;
            border-radius: 18px;
            box-shadow: 
                inset 0 2px 4px rgba(0,0,0,0.4),
                0 0 20px rgba(91, 110, 224, 0.15);
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% {
                box-shadow: inset 0 2px 4px rgba(0,0,0,0.4), 0 0 20px rgba(91, 110, 224, 0.15);
            }
            50% {
                box-shadow: inset 0 2px 4px rgba(0,0,0,0.4), 0 0 30px rgba(91, 110, 224, 0.3);
            }
        }

        .card-header h1 {
            font-weight: 700;
            font-size: 2rem;
            color: #f0f3ff;
            text-shadow: 0 0 30px rgba(91, 110, 224, 0.1);
            letter-spacing: -0.5px;
        }

        .card-header h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: #8b9cf7;
            margin-left: 8px;
            opacity: 0.8;
        }

        .subhead {
            color: #b9c2f0;
            margin-bottom: 1.5rem;
            border-left: 3px solid #6d7ee0;
            padding-left: 16px;
            background: rgba(255,255,255,0.02);
            border-radius: 0 8px 8px 0;
            line-height: 1.5;
            animation: slideInLeft 0.5s ease-out 0.3s both;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .subhead i {
            color: #6d7ee0;
            margin-right: 10px;
        }

        .token-area {
            background: rgba(20, 21, 35, 0.8);
            border-radius: 24px;
            padding: 1.2rem;
            border: 1px solid rgba(68, 71, 102, 0.4);
            box-shadow: 
                inset 0 4px 12px rgba(0,0,0,0.5),
                0 0 20px rgba(91, 110, 224, 0.03);
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease-out 0.4s both;
        }

        .token-area:focus-within {
            border-color: rgba(91, 110, 224, 0.4);
            box-shadow: 
                inset 0 4px 12px rgba(0,0,0,0.5),
                0 0 30px rgba(91, 110, 224, 0.05);
        }

        textarea {
            width: 100%;
            height: 120px;
            background: transparent;
            border: none;
            outline: none;
            resize: vertical;
            color: #e4e9ff;
            font-size: 0.95rem;
            line-height: 1.6;
            font-family: 'Menlo', 'Cascadia Code', monospace;
        }

        textarea::placeholder {
            color: #4a507a;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 300;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.5s ease-out 0.5s both;
        }

        .btn {
            background: rgba(61, 63, 94, 0.6);
            border: 1px solid rgba(88, 92, 130, 0.3);
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #d6deff;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.02);
            border-color: rgba(91, 110, 224, 0.4);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, #5b6ee0, #4a5dc9);
            border-color: #7a8cf5;
            color: white;
            box-shadow: 0 4px 20px rgba(75, 100, 230, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 30px rgba(75, 100, 230, 0.5);
            transform: translateY(-2px) scale(1.02);
        }

        .btn-secondary {
            background: rgba(50, 52, 83, 0.6);
            border-color: rgba(77, 80, 122, 0.3);
        }

        .file-label {
            background: rgba(50, 52, 83, 0.6);
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #d6deff;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border: 1px solid rgba(77, 80, 122, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .file-label:hover {
            background: rgba(65, 68, 107, 0.6);
            transform: translateY(-2px);
            border-color: rgba(91, 110, 224, 0.3);
        }

        #fileInput {
            display: none;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.5s ease-out 0.6s both;
        }

        .stat-box {
            background: rgba(26, 27, 38, 0.6);
            border-radius: 16px;
            padding: 14px 16px;
            text-align: center;
            border: 1px solid rgba(59, 62, 94, 0.3);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-box::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            transform: scaleX(0);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-box:hover::after {
            transform: scaleX(1);
        }

        .stat-box.valid::after { background: #5fdfb0; }
        .stat-box.invalid::after { background: #f7799b; }
        .stat-box.offline::after { background: #b39fdf; }

        .stat-box .number {
            font-size: 2rem;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .stat-box.valid .number { color: #5fdfb0; }
        .stat-box.invalid .number { color: #f7799b; }
        .stat-box.offline .number { color: #b39fdf; }

        .stat-box .label {
            font-size: 0.75rem;
            color: #8892c0;
            margin-top: 4px;
            font-weight: 400;
        }

        .stat-box .number.animate {
            animation: numberPop 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes numberPop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .result-list::-webkit-scrollbar {
            width: 4px;
        }

        .result-list::-webkit-scrollbar-track {
            background: rgba(26, 27, 38, 0.3);
            border-radius: 10px;
        }

        .result-list::-webkit-scrollbar-thumb {
            background: rgba(91, 110, 224, 0.3);
            border-radius: 10px;
            transition: background 0.3s;
        }

        .result-list::-webkit-scrollbar-thumb:hover {
            background: rgba(91, 110, 224, 0.5);
        }

        .result-item {
            background: rgba(26, 27, 38, 0.6);
            border-radius: 16px;
            padding: 14px 18px;
            border: 1px solid rgba(59, 62, 94, 0.2);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideInResult 0.4s ease-out both;
            backdrop-filter: blur(10px);
        }

        .result-item:hover {
            border-color: rgba(91, 110, 224, 0.2);
            transform: translateX(4px);
            background: rgba(30, 31, 45, 0.8);
        }

        @keyframes slideInResult {
            from {
                opacity: 0;
                transform: translateX(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .result-item .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(45, 47, 72, 0.6);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid rgba(77, 80, 122, 0.3);
            transition: all 0.3s ease;
        }

        .result-item:hover .avatar {
            border-color: rgba(91, 110, 224, 0.4);
            transform: scale(1.05);
        }

        .result-item .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .result-item:hover .avatar img {
            transform: scale(1.1);
        }

        .result-item .avatar .default-avatar {
            font-size: 1.8rem;
            color: #6a7099;
        }

        .result-item .info {
            flex: 1;
            min-width: 0;
        }

        .result-item .info .username {
            font-weight: 600;
            color: #f0f3ff;
            font-size: 1rem;
            transition: color 0.3s;
        }

        .result-item:hover .username {
            color: #8b9cf7;
        }

        .result-item .info .details {
            font-size: 0.8rem;
            color: #8892c0;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 2px;
        }

        .result-item .info .details span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color 0.3s;
        }

        .result-item:hover .details span {
            color: #a8b2e0;
        }

        .result-item .status-badge {
            padding: 4px 16px;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 600;
            flex-shrink: 0;
            transition: all 0.3s ease;
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .status-badge.valid {
            background: rgba(31, 61, 58, 0.6);
            border: 1px solid rgba(79, 155, 138, 0.4);
            color: #b0f0d0;
        }

        .status-badge.invalid {
            background: rgba(77, 46, 58, 0.6);
            border: 1px solid rgba(177, 77, 107, 0.4);
            color: #ffb0c7;
        }

        .status-badge.offline {
            background: rgba(62, 58, 74, 0.6);
            border: 1px solid rgba(122, 111, 143, 0.4);
            color: #cfc3f0;
        }

        .status-badge.pending {
            background: rgba(58, 61, 74, 0.6);
            border: 1px solid rgba(106, 112, 153, 0.3);
            color: #a8b2e0;
        }

        .status-badge i {
            margin-right: 4px;
        }

        .footer-hint {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #6d7ee0;
            text-align: center;
            border-top: 1px solid rgba(53, 56, 79, 0.3);
            padding-top: 14px;
            letter-spacing: 0.5px;
            font-weight: 400;
            animation: fadeInUp 0.5s ease-out 0.7s both;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .footer-hint:hover {
            opacity: 1;
        }

        .footer-hint i {
            margin-right: 6px;
            color: #6d7ee0;
        }

        .loading-spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .empty-state {
            color: #4a507a;
            text-align: center;
            padding: 2.5rem 1rem;
            animation: fadeInUp 0.5s ease;
        }

        .empty-state i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.75rem;
            opacity: 0.5;
        }

        .empty-state .sub-text {
            font-size: 0.85rem;
            margin-top: 0.5rem;
            opacity: 0.6;
        }

        .nitro-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        .nitro-indicator.nitro-classic {
            background: rgba(109, 126, 224, 0.15);
            border: 1px solid rgba(109, 126, 224, 0.3);
            color: #8b9cf7;
        }

        .nitro-indicator.nitro-boost {
            background: rgba(247, 121, 155, 0.15);
            border: 1px solid rgba(247, 121, 155, 0.3);
            color: #f7799b;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(28, 29, 45, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(68, 71, 102, 0.3);
            border-radius: 16px;
            padding: 14px 24px;
            color: #e4e9ff;
            font-size: 0.9rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            animation: slideUp 0.4s ease-out;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 400px;
        }

        .toast.success { border-left: 4px solid #5fdfb0; }
        .toast.error { border-left: 4px solid #f7799b; }
        .toast.info { border-left: 4px solid #8b9cf7; }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .card { padding: 1.5rem; }
            .result-item { flex-wrap: wrap; }
            .result-item .info { flex: 1 1 100%; }
            .stats { grid-template-columns: repeat(3, 1fr); }
            .card-header h1 { font-size: 1.5rem; }
            .card-header h1 small { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <i class="fab fa-discord"></i>
                <h1>Account <small>Token Check</small></h1>
            </div>
            <div class="subhead">
                <i class="fas fa-user-circle"></i>
                Prüfe Tokens &amp; zeige Profilbild, Benutzername und Account-Alter
            </div>

            <div class="token-area">
                <textarea id="tokenInput" placeholder="Token hier einfügen, einer pro Zeile …"></textarea>
            </div>

            <div class="action-row">
                <button class="btn btn-primary" id="checkTokensBtn">
                    <i class="fas fa-check-circle"></i> Check Tokens
                </button>
                <label for="fileInput" class="file-label">
                    <i class="fas fa-file-import"></i> Load from File
                </label>
                <input type="file" id="fileInput" accept=".txt,.csv,.list">
                <button class="btn btn-secondary" id="clearBtn">
                    <i class="fas fa-trash"></i> Clear
                </button>
            </div>

            <div class="stats" id="statsContainer">
                <div class="stat-box valid">
                    <div class="number" id="validCount">0</div>
                    <div class="label"><i class="fas fa-check-circle"></i> Gültig</div>
                </div>
                <div class="stat-box invalid">
                    <div class="number" id="invalidCount">0</div>
                    <div class="label"><i class="fas fa-times-circle"></i> Ungültig</div>
                </div>
                <div class="stat-box offline">
                    <div class="number" id="offlineCount">0</div>
                    <div class="label"><i class="fas fa-circle"></i> Offline</div>
                </div>
            </div>

            <div id="resultContainer">
                <div class="result-list" id="resultList"></div>
            </div>

            <div class="footer-hint">
                <i class="fas fa-code"></i> Checker by Dxsetup
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Partikel
            function createParticles() {
                const container = document.getElementById('particles');
                for (let i = 0; i < 30; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.animationDuration = (15 + Math.random() * 25) + 's';
                    particle.style.animationDelay = (Math.random() * 20) + 's';
                    particle.style.width = (1 + Math.random() * 3) + 'px';
                    particle.style.height = particle.style.width;
                    particle.style.opacity = 0.1 + Math.random() * 0.3;
                    container.appendChild(particle);
                }
            }
            createParticles();

            // DOM
            const tokenInput = document.getElementById('tokenInput');
            const checkBtn = document.getElementById('checkTokensBtn');
            const fileInput = document.getElementById('fileInput');
            const clearBtn = document.getElementById('clearBtn');
            const resultList = document.getElementById('resultList');
            const validCount = document.getElementById('validCount');
            const invalidCount = document.getElementById('invalidCount');
            const offlineCount = document.getElementById('offlineCount');

            const tokenCache = new Map();

            // Toast
            function showToast(message, type = 'info') {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();

                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                
                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    info: 'fa-info-circle'
                };
                
                toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${message}`;
                document.body.appendChild(toast);

                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(20px)';
                    setTimeout(() => toast.remove(), 400);
                }, 5000);
            }

            function getAccountAgeFromId(userId) {
                try {
                    const snowflake = BigInt(userId);
                    const timestamp = Number((snowflake >> 22n) + 1420070400000n);
                    const created = new Date(timestamp);
                    const now = new Date();
                    
                    if (isNaN(created.getTime())) return 'Unbekannt';

                    const diffMs = now - created;
                    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                    
                    if (diffDays < 1) {
                        const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
                        return `${diffHours} Stunde${diffHours !== 1 ? 'n' : ''}`;
                    } else if (diffDays < 30) {
                        return `${diffDays} Tag${diffDays !== 1 ? 'e' : ''}`;
                    } else if (diffDays < 365) {
                        const months = Math.floor(diffDays / 30);
                        const remainingDays = diffDays % 30;
                        if (remainingDays === 0) return `${months} Monat${months !== 1 ? 'e' : ''}`;
                        return `${months} Monat${months !== 1 ? 'e' : ''}, ${remainingDays} Tag${remainingDays !== 1 ? 'e' : ''}`;
                    } else {
                        const years = Math.floor(diffDays / 365);
                        const remainingDays = diffDays % 365;
                        const months = Math.floor(remainingDays / 30);
                        const days = remainingDays % 30;
                        
                        let result = `${years} Jahr${years > 1 ? 'e' : ''}`;
                        if (months > 0) result += `, ${months} Monat${months > 1 ? 'e' : ''}`;
                        if (days > 0 && months === 0) result += `, ${days} Tag${days > 1 ? 'e' : ''}`;
                        return result;
                    }
                } catch (e) {
                    return 'Unbekannt';
                }
            }

            async function checkToken(token) {
                const clean = token.trim();
                if (!clean) return { status: 'empty', error: 'Leeres Token', token: clean };

                if (tokenCache.has(clean)) {
                    return tokenCache.get(clean);
                }

                try {
                    const response = await fetch('https://discord.com/api/v10/users/@me', {
                        headers: {
                            'Authorization': clean,
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                        }
                    });

                    let result = { status: 'invalid', error: 'Unbekannter Fehler', token: clean };

                    if (response.status === 200) {
                        const data = await response.json();
                        const avatarUrl = data.avatar 
                            ? `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png?size=64`
                            : null;
                        
                        const age = getAccountAgeFromId(data.id);

                        let nitro = 'none';
                        if (data.premium_type === 2) nitro = 'boost';
                        else if (data.premium_type === 1) nitro = 'classic';

                        result = {
                            status: 'valid',
                            username: data.username,
                            discriminator: data.discriminator || '0',
                            id: data.id,
                            avatar: avatarUrl,
                            age: age,
                            verified: data.verified || false,
                            email: data.email || null,
                            nitro: nitro,
                            token: clean,
                            raw: data
                        };
                    } else if (response.status === 401) {
                        result = { status: 'invalid', error: 'Ungültiger Token', token: clean };
                    } else if (response.status === 429) {
                        const retryAfter = response.headers.get('retry-after');
                        result = { status: 'offline', error: `Rate Limit (${retryAfter || '?'}s)`, token: clean };
                    } else if (response.status === 403) {
                        result = { status: 'invalid', error: 'Token gesperrt / keine Berechtigung', token: clean };
                    } else {
                        result = { status: 'offline', error: `HTTP ${response.status}`, token: clean };
                    }

                    tokenCache.set(clean, result);
                    return result;
                } catch (error) {
                    const result = { status: 'offline', error: 'Netzwerkfehler', token: clean };
                    tokenCache.set(clean, result);
                    return result;
                }
            }

            function renderResultItem(token, result, index) {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.style.animationDelay = `${index * 0.08}s`;

                const avatarDiv = document.createElement('div');
                avatarDiv.className = 'avatar';
                if (result.status === 'valid' && result.avatar) {
                    const img = document.createElement('img');
                    img.src = result.avatar;
                    img.alt = 'Avatar';
                    img.loading = 'lazy';
                    avatarDiv.appendChild(img);
                } else {
                    const icon = document.createElement('i');
                    icon.className = 'fas fa-user default-avatar';
                    avatarDiv.appendChild(icon);
                }

                const infoDiv = document.createElement('div');
                infoDiv.className = 'info';
                
                const usernameSpan = document.createElement('div');
                usernameSpan.className = 'username';
                if (result.status === 'valid') {
                    const displayName = result.discriminator && result.discriminator !== '0' 
                        ? `${result.username}#${result.discriminator}`
                        : result.username;
                    usernameSpan.textContent = displayName;

                    if (result.nitro && result.nitro !== 'none') {
                        const nitroSpan = document.createElement('span');
                        const nitroClass = result.nitro === 'boost' ? 'nitro-boost' : 'nitro-classic';
                        nitroSpan.className = `nitro-indicator ${nitroClass}`;
                        if (result.nitro === 'boost') {
                            nitroSpan.innerHTML = '<i class="fas fa-bolt"></i> Nitro Boost';
                        } else {
                            nitroSpan.innerHTML = '<i class="fas fa-crown"></i> Nitro Classic';
                        }
                        usernameSpan.appendChild(nitroSpan);
                    }
                } else {
                    const shortToken = token.length > 20 ? token.slice(0, 16) + '…' : token;
                    usernameSpan.textContent = result.status === 'pending' ? '⏳ Prüfe…' : shortToken;
                }

                const detailsSpan = document.createElement('div');
                detailsSpan.className = 'details';
                
                if (result.status === 'valid') {
                    const idSpan = document.createElement('span');
                    idSpan.innerHTML = `<i class="fas fa-id-card"></i> ${result.id}`;
                    detailsSpan.appendChild(idSpan);

                    const ageSpan = document.createElement('span');
                    ageSpan.innerHTML = `<i class="fas fa-clock"></i> ${result.age}`;
                    detailsSpan.appendChild(ageSpan);

                    if (result.verified) {
                        const verifiedSpan = document.createElement('span');
                        verifiedSpan.innerHTML = `<i class="fas fa-check-circle" style="color: #5fdfb0;"></i> Verifiziert`;
                        detailsSpan.appendChild(verifiedSpan);
                    }

                    if (result.email) {
                        const emailSpan = document.createElement('span');
                        emailSpan.innerHTML = `<i class="fas fa-envelope"></i> ${result.email}`;
                        detailsSpan.appendChild(emailSpan);
                    }
                } else if (result.status === 'pending') {
                    const pendingSpan = document.createElement('span');
                    pendingSpan.innerHTML = `<i class="fas fa-spinner loading-spinner"></i> Wird geprüft…`;
                    detailsSpan.appendChild(pendingSpan);
                } else {
                    const errorSpan = document.createElement('span');
                    errorSpan.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${result.error || 'Fehler'}`;
                    detailsSpan.appendChild(errorSpan);
                }

                infoDiv.appendChild(usernameSpan);
                infoDiv.appendChild(detailsSpan);

                const badge = document.createElement('span');
                badge.className = `status-badge ${result.status}`;
                if (result.status === 'valid') {
                    badge.innerHTML = '<i class="fas fa-check-circle"></i> VALID';
                } else if (result.status === 'invalid') {
                    badge.innerHTML = '<i class="fas fa-times-circle"></i> INVALID';
                } else if (result.status === 'offline') {
                    badge.innerHTML = '<i class="fas fa-circle"></i> OFFLINE';
                } else {
                    badge.innerHTML = '<i class="fas fa-clock"></i> PENDING';
                }

                div.appendChild(avatarDiv);
                div.appendChild(infoDiv);
                div.appendChild(badge);

                return div;
            }

            function updateStats(results) {
                let valid = 0, invalid = 0, offline = 0;
                results.forEach(r => {
                    if (r.status === 'valid') valid++;
                    else if (r.status === 'invalid') invalid++;
                    else if (r.status === 'offline') offline++;
                });
                
                const animateNumber = (element, newValue) => {
                    if (element.textContent !== String(newValue)) {
                        element.textContent = newValue;
                        element.classList.remove('animate');
                        void element.offsetWidth;
                        element.classList.add('animate');
                    }
                };
                
                animateNumber(validCount, valid);
                animateNumber(invalidCount, invalid);
                animateNumber(offlineCount, offline);
            }

            async function processTokens() {
                const raw = tokenInput.value;
                const lines = raw.split(/\r?\n/);
                const tokens = lines.map(l => l.trim()).filter(t => t.length > 0);

                if (tokens.length === 0) {
                    resultList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <div>Keine Tokens zum Prüfen</div>
                            <div class="sub-text">Füge Tokens in das Textfeld ein</div>
                        </div>
                    `;
                    updateStats([]);
                    return;
                }

                const pendingResults = tokens.map(t => ({ status: 'pending', error: 'Prüfe…', token: t }));
                renderResults(tokens, pendingResults);
                updateStats(pendingResults);

                const results = [];
                for (let i = 0; i < tokens.length; i++) {
                    const token = tokens[i];
                    const result = await checkToken(token);
                    results.push(result);

                    const currentResults = [...results];
                    for (let j = results.length; j < tokens.length; j++) {
                        currentResults.push({ status: 'pending', error: 'Prüfe…', token: tokens[j] });
                    }
                    renderResults(tokens, currentResults);
                    updateStats(currentResults);

                    if (i < tokens.length - 1) {
                        await new Promise(resolve => setTimeout(resolve, 200));
                    }
                }
            }

            function renderResults(tokens, results) {
                resultList.innerHTML = '';
                tokens.forEach((token, index) => {
                    const result = results[index] || { status: 'pending', error: 'Wird geprüft…', token: token };
                    const item = renderResultItem(token, result, index);
                    resultList.appendChild(item);
                });
            }

            // Events
            checkBtn.addEventListener('click', processTokens);

            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(ev) {
                    tokenInput.value = ev.target.result;
                    processTokens();
                    fileInput.value = '';
                };
                reader.readAsText(file, 'UTF-8');
            });

            clearBtn.addEventListener('click', function() {
                tokenInput.value = '';
                resultList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <div>Keine Tokens zum Prüfen</div>
                        <div class="sub-text">Füge Tokens in das Textfeld ein</div>
                    </div>
                `;
                updateStats([]);
                tokenCache.clear();
            });

            tokenInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    processTokens();
                }
            });

            window.addEventListener('DOMContentLoaded', function() {
                resultList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-rocket"></i>
                        <div>Bereit für die Token-Prüfung</div>
                        <div class="sub-text">Füge Tokens ein und klicke auf "Check Tokens"</div>
                    </div>
                `;
                updateStats([]);
            });

            console.log('✅ Discord Token Checker geladen.');
        })();
    </script>
</body>
</html>
